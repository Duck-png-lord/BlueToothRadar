name: Build Bluetooth Radar EXE

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained EXE
        run: >
          dotnet publish BluetoothRadar/BluetoothRadar.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothRadar-windows-x64
          path: BluetoothRadar/bin/Release/net8.0-windows10.0.26100.0/win-x64/publish/
          if-no-files-found: error
